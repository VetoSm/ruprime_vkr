services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: ./services/auth
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_EXPIRES_MIN: ${JWT_ACCESS_EXPIRES_MIN}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS}
      SEED_TEST_DATA: ${SEED_TEST_DATA}
    depends_on:
      postgres:
        condition: service_healthy

  core:
    build: ./services/core
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      LLM_SERVICE_URL: ${LLM_SERVICE_URL}
      SEED_TEST_DATA: ${SEED_TEST_DATA}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  ml:
    build: ./services/ml
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAGGLE_DATA_PATH: ${KAGGLE_DATA_PATH}
    volumes:
      - ./archive-2:/data/archive-2:ro
    depends_on:
      postgres:
        condition: service_healthy

  llm:
    build: ./services/llm
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      VITE_AUTH_API_URL: http://localhost:8001
      VITE_CORE_API_URL: http://localhost:8002
      VITE_ML_API_URL: http://localhost:8003
    depends_on:
      - auth
      - core
      - ml
      - llm

volumes:
  pgdata:
